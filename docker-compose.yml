services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 8

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic:clinic@db:5432/clinic
      CLINIC_TIMEZONE: Africa/Nairobi
      MIN_BOOKING_NOTICE_MINUTES: "60"
      MAX_BOOKING_AHEAD_DAYS: "90"
      SEED_SAMPLE_DATA: "true"
      CORS_ORIGINS: "*"
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy

  testd:
    profiles: ["test"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic:clinic@db:5432/clinic_test
      TEST_DATABASE_URL: postgresql+asyncpg://clinic:clinic@db:5432/clinic_test
      CLINIC_TIMEZONE: Africa/Nairobi
      MIN_BOOKING_NOTICE_MINUTES: "60"
      MAX_BOOKING_AHEAD_DAYS: "90"
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pip install --upgrade pip && pip install '.[dev]' && ruff check . && pytest -q"

volumes:
  pgdata:
