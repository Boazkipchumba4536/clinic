name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_test
      DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_test
      CLINIC_TIMEZONE: Africa/Nairobi
      MIN_BOOKING_NOTICE_MINUTES: "60"
      MAX_BOOKING_AHEAD_DAYS: "90"
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
